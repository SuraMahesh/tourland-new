  <path d="M48 12 L55.5 40.5 L84 48 L55.5 55.5 L48 84 L40.5 55.5 L12 48 L40.5 40.5 Z" fill="#f8f4ea"/>
  <path d="M48 12 L55.5 40.5 L48 48 Z" fill="#d97742"/>
  <path d="M48 48 L55.5 55.5 L48 84 Z" fill="#e8dcc4"/>
  <path d="M12 48 L40.5 40.5 L48 48 Z" fill="#e8dcc4"/>
  <circle cx="48" cy="48" r="4.5" fill="#d97742"/>
</svg>
